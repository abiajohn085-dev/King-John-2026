<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calculator</title>
<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;background:#111;font-family:Arial}
.calc{background:#222;padding:20px;border-radius:15px;width:300px;border:2px solid #FFD700}
#display{width:100%;height:60px;background:black;color:#FFD700;font-size:28px;text-align:right;padding:10px;border:none;margin-bottom:15px;border-radius:8px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;font-size:20px;border:none;border-radius:8px;background:#333;color:white;cursor:pointer}
button:hover{background:#FFD700;color:black}
.equal{background:#FFD700;color:black;grid-column:span 2}
</style>
</head>
<body>
<div class="calc">
<input id="display" disabled>
<div class="buttons">
<button onclick="c()">C</button>
<button onclick="add('/')">/</button>
<button onclick="add('*')">*</button>
<button onclick="del()">DEL</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button onclick="add('-')">-</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button onclick="add('+')">+</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button onclick="add('.')">.</button>
<button onclick="add('0')">0</button><button onclick="calc()" class="equal">=</button>
</div>
</div>
<script>
let d=document.getElementById('display');
function add(v){d.value+=v} function c(){d.value=''} function del(){d.value=d.value.slice(0,-1)}
function calc(){try{d.value=eval(d.value)}catch{d.value='Error'}}
</script>
</body>
</html>
